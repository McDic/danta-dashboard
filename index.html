<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>실현손익 대시보드</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>KRX 선물 실현손익</h1>
          <p class="muted" id="updated"></p>
        </div>
        <div class="range" role="group" aria-label="기간">
          <button type="button" data-range="1m">1개월</button>
          <button type="button" data-range="3m">3개월</button>
          <button type="button" data-range="ytd">올해</button>
          <button type="button" data-range="all" aria-pressed="true">전체</button>
        </div>
      </header>

      <p class="error" id="error" hidden></p>

      <section class="hero" aria-label="요약">
        <p class="label">누적 순손익 <span class="muted">(수수료 차감 후)</span></p>
        <p class="hero-value" id="hero-value">–</p>
        <p class="muted" id="hero-sub"></p>
      </section>

      <section class="tiles" id="tiles" aria-label="지표"></section>

      <section class="card">
        <h2>누적 순손익 · 일별 손익 · 낙폭</h2>
        <div class="chart chart-tall" id="chart-pnl"></div>
      </section>

      <section class="card">
        <h2>거래대금(왕복) · 수수료</h2>
        <div class="chart chart-mid" id="chart-turnover"></div>
      </section>

      <section class="card">
        <h2>일별 순손익 달력</h2>
        <div class="chart" id="chart-calendar"></div>
      </section>

      <section class="card">
        <h2>월별</h2>
        <div class="table-wrap"><table id="table-month"></table></div>
      </section>

      <details class="card">
        <summary><h2>일별 상세</h2></summary>
        <div class="table-wrap"><table id="table-day"></table></div>
      </details>

      <footer class="muted">
        실현손익만 집계합니다 (미실현손익·양도소득세 제외). 거래대금은 진입+청산 양쪽 체결 금액입니다.
        이익은 빨강, 손실은 파랑으로 표시합니다.
      </footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
